[project]
name = "p1monitor"
version = "0.0.0"
description = "Asynchronous Python client for the P1 Monitor"
authors = [{ name="Klaas Schoute", email="hello@student-techlife.com"}]
maintainers = [{name="Klaas Schoute", email="hello@student-techlife.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
readme = "README.md"
keywords = ["p1", "monitor", "power", "energy", "api", "async", "client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp>=3.0.0",
  "yarl>=1.6.0",
]

[tool.poetry]
packages = [
  { include = "p1monitor", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.12"

[project.urls]
homepage = "https://github.com/klaasnicolaas/python-p1monitor"
repository = "https://github.com/klaasnicolaas/python-p1monitor"
documentation = "https://github.com/klaasnicolaas/python-p1monitor"
"Bug Tracker" = "https://github.com/klaasnicolaas/python-p1monitor/issues"
Changelog = "https://github.com/klaasnicolaas/python-p1monitor/releases"

[tool.poetry.group.dev.dependencies]
aresponses = "3.0.0"
codespell = "2.4.3"
covdefaults = "2.3.0"
coverage = {version = "7.16.0", extras = ["toml"]}
pre-commit-hooks = "6.0.0"
prek = "0.5.2"
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
ruff = "0.16.6"
syrupy = "6.0.0"
ty = "0.0.75"
yamllint = "1.38.0"
zizmor = "1.30.0"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["p1monitor"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = "--cov"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
lint.extend-ignore = ["CPY001"] # Project files do not use copyright headers
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",  # Opinionated warning on disallowing dynamically typed expressions
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "SLOT000", # Has a bug with enums: https://github.com/astral-sh/ruff/issues/5748

  # Conflicts with the Ruff formatter
  "COM812",
]


[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["p1monitor"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.2.0"]
